name: Schematron compile check

on:
  pull_request:
    paths:
      - dracor.odd
      - tests/**
      - .github/workflows/test.yml
  push:
    branches: [main]
    paths:
      - dracor.odd
      - .github/workflows/test.yml
  workflow_dispatch:

jobs:
  compile-schematron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - run: ./build

      - name: Download schxslt-cli
        run: |
          curl -sSLf -o schxslt-cli.jar \
            https://codeberg.org/SchXslt/schxslt/releases/download/v1.10.1/schxslt-cli.jar

      - name: Run Schematron against base test file
        run: |
          java -jar schxslt-cli.jar \
            -d tests/tst000000-base.xml \
            -s dist/dracor.sch \
            -o /tmp/svrl.xml
