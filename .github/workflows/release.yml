name: Generate release assets and deploy

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check if this is a rerun
        id: is-rerun
        run: |
          if [[ "${{ github.run_attempt }}" -gt 1 ]]; then
            echo "is_rerun=true" >> $GITHUB_ENV
          else
            echo "is_rerun=false" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - run: ./build

      - name: Upload RNG
        if: env.is_rerun == 'false'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/dracor.rng
          asset_name: dracor-schema-${{ github.event.release.tag_name }}.rng
          asset_content_type: application/xml

      - name: Upload Schematron
        if: env.is_rerun == 'false'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/dracor.sch
          asset_name: dracor-schema-${{ github.event.release.tag_name }}.sch
          asset_content_type: application/xml

      - name: Upload HTML
        if: env.is_rerun == 'false'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/index.html
          asset_name: dracor-guidelines-${{ github.event.release.tag_name }}.html
          asset_content_type: text/html

      - name: Upload dist for the deployments
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # in case of "Re-run all jobs"
          overwrite: true

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

      - name: Notify dracor-validate-action
        if: ${{ ! github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ secrets.VALIDATE_ACTION_DISPATCH_TOKEN }}
        run: |
          gh api repos/dracor-org/dracor-validate-action/dispatches \
            -f event_type=dracor-schema-released \
            -f 'client_payload[tag]=${{ github.event.release.tag_name }}'

  # Each server has a GitHub environment with its own DEPLOY_KEY. dev needs an
  # approval (see deploy-key.sh in dracor-org-deployment); staging and
  # production accept release tags,
  # which only org owners can create. Production waits for staging, but not
  # for dev, whose approval may come later or never.
  deploy-dev:
    needs: build
    uses: ./.github/workflows/deployment.yml
    # Without this, DEPLOY_KEY of the environment arrives empty in the reusable
    # workflow (tested in dracor-docs). It also passes the other secrets, but
    # deployment.yml comes from the same commit and only uses DEPLOY_KEY.
    secrets: inherit
    with:
      environment: dev
      host: dev.dracor.org

  deploy-staging:
    needs: build
    uses: ./.github/workflows/deployment.yml
    secrets: inherit
    with:
      environment: staging
      host: staging.dracor.org
      versioned-odd: ${{ github.event.release.tag_name }}

  deploy-production:
    if: ${{ ! github.event.release.prerelease }}
    needs: [build, deploy-staging]
    uses: ./.github/workflows/deployment.yml
    secrets: inherit
    with:
      environment: production
      host: dracor.org

  # There are environment rules that restrict which tags can deploy to the
  # github-pages environment, see
  # https://github.com/dracor-org/dracor-schema/settings/environments/5489677481/edit
  deploy:
    if: ${{ ! github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
