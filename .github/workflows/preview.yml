name: PR Previews

# Builds the ODD of a pull request. This runs the code of the pull request,
# including this file, so the deploy key isn't used here: preview-deploy.yml,
# which GitHub always runs from the default branch, deploys the result.

# The paths filter looks at the whole PR (compared with its merge base), so
# every push to a PR that changes dracor.odd builds the PR's current state.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - dracor.odd

permissions:
  contents: read

# a new push cancels older builds
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: ./build
      - run: ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # in case of "Re-run all jobs"
          overwrite: true

