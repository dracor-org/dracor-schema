name: PR Previews

# Builds the ODD of a pull request and deploys it to
# https://staging.dracor.org/previews/. The build runs the code of the pull
# request without access to the key. The deployment uses the DEPLOY_KEY of the
# GitHub environment "preview", which needs the approval of the team core and
# which the server restricts to rsync into the previews directory (see
# dracor-org-deployment).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - dracor.odd

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      odd: ${{ steps.check.outputs.odd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check if dracor.odd changed
        id: check
        env:
          ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail
          # Check only the newly pushed commits, or all commits on the branch
          # if the PR is new or the previous head is gone (force push)
          if [ "$ACTION" != "opened" ] && [ "$ACTION" != "reopened" ] &&
            git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE=$BEFORE
          else
            BASE=$BASE_SHA
          fi
          if git diff --name-only "${BASE}..HEAD" | grep -q '^dracor\.odd$'; then
            echo "odd=true" >> $GITHUB_OUTPUT
          else
            echo "odd=false" >> $GITHUB_OUTPUT
          fi

  build-preview:
    needs: check-changes
    if: needs.check-changes.outputs.odd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: ./build
      - run: ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Only the file named after this PR: dist comes from the PR's code, which
      # could produce files named after other PRs.
      - name: Prepare files
        env:
          PR: ${{ github.event.number }}
        run: |
          mkdir out
          cp dist/index.html "out/odd-$PR.html"
          ls -l out

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to staging.dracor.org
        run: |
          rsync -rlvz \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes' \
            out/ \
            github@staging.dracor.org:/

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # one comment per PR, updated by later deployments
      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = `https://staging.dracor.org/previews/odd-${context.issue.number}.html`;
            const marker = '<!-- dracor-schema-preview -->';
            const body = `${marker}\n**Preview available:** ${url}\n\nLast deployed: ${context.sha}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
