name: PR Previews

# Builds the ODD of a pull request and deploys it to
# https://staging.dracor.org/previews/. The build runs the code of the pull
# request without access to the key. The deployment uses the DEPLOY_KEY of the
# GitHub environment "preview", which needs the approval of the team core and
# which the server restricts to rsync into the previews directory (see
# dracor-org-deployment).

# The paths filter looks at the whole PR (compared with its merge base), so
# every push to a PR that changes dracor.odd deploys the PR's current state.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - dracor.odd

permissions:
  contents: read

# A new push cancels older runs, including those waiting for approval, so an
# older build can't overwrite a newer preview.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: ./build
      - run: ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # in case of "Re-run all jobs"
          overwrite: true

  # Pull requests from forks get neither DEPLOY_KEY nor permission to comment.
  deploy-preview:
    needs: build-preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      # first, so that missing settings fail before anything else
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_KEY:?secret DEPLOY_KEY is not set for this environment}"
          : "${DEPLOY_KNOWN_HOSTS:?variable DEPLOY_KNOWN_HOSTS is not set for this environment}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Only the file named after this PR: dist comes from the PR's code, which
      # could produce files named after other PRs.
      - name: Prepare files
        env:
          PR: ${{ github.event.number }}
        run: |
          mkdir out
          cp dist/index.html "out/odd-$PR.html"
          ls -l out

      - name: Deploy to staging.dracor.org
        run: |
          rsync -rlvz \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes' \
            out/ \
            github@staging.dracor.org:/

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # one comment per PR, updated by later deployments
      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = `https://staging.dracor.org/previews/odd-${context.issue.number}.html`;
            const marker = '<!-- dracor-schema-preview -->';
            const body = `${marker}\n**Preview available:** ${url}\n\nLast deployed: ${context.payload.pull_request.head.sha}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
